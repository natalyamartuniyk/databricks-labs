bundle:
  name: youtube_lakeflow
  uuid: eaf95f08-92d6-4ea5-8b30-d3558c55e8c8

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for all layers
  bronze_schema:
    description: Schema for raw (bronze) tables
  silver_schema:
    description: Schema for cleaned (silver) tables
  gold_schema:
    description: Schema for dimensions and facts (gold)
  raw_volume_path:
    description: Volume folder with raw source files
  raw_source_path:
    description: Volume folder with the original source files (copied to the target raw volume)
    default: /Volumes/dbr_dev_ua5816bd/natalkamartinuk55/raw_data
targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405604651938730.10.azuredatabricks.net
    variables:
      catalog: dbr_dev_ua5816bd
      bronze_schema: natalkamartinuk55_bronze
      silver_schema: natalkamartinuk55_silver
      gold_schema: natalkamartinuk55_gold
      raw_volume_path: /Volumes/dbr_dev_ua5816bd/natalkamartinuk55/raw_data

  prod:
    mode: production
    workspace:
      host: https://adb-7405613488297663.3.azuredatabricks.net
      root_path: /Workspace/Users/d1a2118a-1d70-44cf-ba58-ea3454da6727/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: d1a2118a-1d70-44cf-ba58-ea3454da6727
    permissions:
      - user_name: natalkamartinuk55@softserve.academy
        level: CAN_MANAGE
      - service_principal_name: d1a2118a-1d70-44cf-ba58-ea3454da6727
        level: CAN_MANAGE
    variables:
      catalog: dbr_dev_ua_5816_trail_3
      bronze_schema: natalkamartinuk55_youtube_bronze
      silver_schema: natalkamartinuk55_youtube_silver
      gold_schema: natalkamartinuk55_youtube_gold
      raw_volume_path: /Volumes/dbr_dev_ua_5816_trail_3/natalkamartinuk55_youtube_bronze/raw_data
    resources:
      schemas:
        bronze:
          name: natalkamartinuk55_youtube_bronze
          catalog_name: ${var.catalog}
          grants:
            - principal: natalkamartinuk55@softserve.academy
              privileges: [USE_SCHEMA, SELECT, READ_VOLUME]
        silver:
          name: natalkamartinuk55_youtube_silver
          catalog_name: ${var.catalog}
          grants:
            - principal: natalkamartinuk55@softserve.academy
              privileges: [USE_SCHEMA, SELECT]
        gold:
          name: natalkamartinuk55_youtube_gold
          catalog_name: ${var.catalog}
          grants:
            - principal: natalkamartinuk55@softserve.academy
              privileges: [USE_SCHEMA, SELECT]
      volumes:
        raw_data:
          name: raw_data
          catalog_name: ${var.catalog}
          schema_name: ${resources.schemas.bronze.name}
      pipelines:
        youtube_lakeflow_etl:
          schema: ${resources.schemas.bronze.name}

