bundle:
  name: youtube_gold_tests

sync:
  exclude:
    - .venv
    - .pytest_cache
    - "**/__pycache__"
    - youtube_lakeflow

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405604651938730.10.azuredatabricks.net

resources:
  jobs:
    unit_tests:
      name: lab7_unit_tests
      tasks:
        - task_key: run_pytest
          existing_cluster_id: 0828-065013-gln8ogbm
          notebook_task:
            notebook_path: ./notebooks/run_unit_tests.py

    dq_suite:
      name: lab7_dq_suite
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName} 
      tasks:
        - task_key: run_dq_suite
          existing_cluster_id: 0828-065013-gln8ogbm
          notebook_task:
            notebook_path: ./notebooks/05_dq_suite.py
            base_parameters:
              env: dev

